<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Flow Express — Pedidos rápidos Vectore Flow">
    <meta name="theme-color" content="#0c0927">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow">
    <title>Flow Express ⚡</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest-vf.json?v=2">
    <link rel="icon" type="image/svg+xml" href="/flow-express.svg?v=2">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="/assets/flow-express-icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Supabase JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="flow-express.css">
</head>

<body>
    <!-- ============================================
         Login Screen
         ============================================ -->
    <div class="fe-login-screen" id="feLoginScreen">
        <div class="fe-login-card">
            <div class="fe-login-logo">⚡</div>
            <h1>Flow Express</h1>
            <p>Pedidos rápidos desde cualquier lugar</p>

            <form class="fe-login-form" id="feLoginForm" onsubmit="handleEmailLogin(event)">
                <input class="fe-input" type="email" id="feLoginEmail" placeholder="tu@correo.com" required autocomplete="email">
                <input class="fe-input" type="password" id="feLoginPassword" placeholder="Contraseña" required autocomplete="current-password">
                <div class="fe-login-error" id="feLoginError" style="display: none;"></div>
                <button type="submit" class="fe-submit-btn" id="feLoginBtn">⚡ Entrar</button>
            </form>

            <div class="fe-login-divider"><span>o</span></div>

            <button class="fe-google-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- ============================================
         App (Post-Login)
         ============================================ -->
    <div class="fe-app" id="feApp" style="display: none;">
        <!-- Header -->
        <header class="fe-header">
            <div class="fe-header-brand">
                <img src="favicon.png" alt="V">
                <span>Flow</span>
                <span class="fe-badge-express">EXPRESS</span>
            </div>
            <div class="fe-header-user">
                <span id="feUserName"></span>
                <button class="fe-logout-btn" onclick="handleLogout()">Salir</button>
            </div>
        </header>

        <!-- Content -->
        <div class="fe-content">
            <!-- Quick Order Form -->
            <div class="fe-form-section">
                <h1 class="fe-form-title">Nuevo Pedido ⚡</h1>
                <p class="fe-form-subtitle">Registra en 3 segundos. Después lo procesas en la PC.</p>

                <form class="fe-form" id="feOrderForm" onsubmit="handleCreateOrder(event)">
                    <div class="fe-field">
                        <label for="feClientName">Cliente</label>
                        <input class="fe-input" type="text" id="feClientName" placeholder="Nombre del cliente" required autocomplete="off">
                    </div>

                    <div class="fe-field">
                        <label for="feDetail">Detalle del pedido</label>
                        <textarea class="fe-input" id="feDetail" placeholder="Banner 3x2m, vinil adhesivo..." required rows="2"></textarea>
                    </div>

                    <div class="fe-field">
                        <label for="fePrice">Precio</label>
                        <div class="fe-input-price">
                            <input class="fe-input" type="number" id="fePrice" placeholder="0.00" required min="0" step="0.01" inputmode="decimal">
                        </div>
                    </div>

                    <button type="submit" class="fe-submit-btn" id="feSubmitBtn">⚡ Guardar Pedido</button>
                </form>
            </div>

            <!-- Recent Orders -->
            <div class="fe-orders-section">
                <div class="fe-orders-header">
                    <h2>Pedidos Recientes</h2>
                    <span class="fe-count" id="feOrdersCount">—</span>
                </div>
                <div class="fe-orders-list" id="feOrdersList">
                    <div class="fe-empty">
                        <div class="fe-empty-icon">📋</div>
                        <p>Cargando pedidos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="fe-toast" id="feToast"></div>

    <!-- Logic -->
    <script src="flow-express.js"></script>
</body>

</html>
